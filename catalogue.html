<!DOCTYPE html>
<html lang="fr">
 <head>
<meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="H&amp;R Legacy, concessionnaire automobile à San Andreas." name="description"/>
  <title>
   Catalogue | H&amp;R Legacy
  </title>
  <link href="assets/css/style.css" rel="stylesheet"/>
  <script defer="" src="assets/js/config.js">
  </script>
  <script defer="" src="assets/js/app.js">
  </script>
 </head>
 <body data-page="catalogue">
  <div id="header">
  </div>
  <main>
   <div class="container">
    <div class="page-head">
     <h1>
      Notre catalogue
     </h1>
     <p class="muted">
      Trouvez le véhicule qui vous correspond.
     </p>
    </div>
    <div id="status">
    </div>
    <div class="filters-toolbar">
     <button type="button" id="toggle-filters" class="btn-filters" aria-expanded="false" aria-controls="filters-panel">
      <span>☷ Filtres avancés</span><span id="filters-arrow" aria-hidden="true">▾</span>
     </button>
    </div>
    <div class="filters" id="filters-panel" hidden>
     <div class="filter-heading">
      <strong>
       Filtrer les véhicules
      </strong>
      <button class="btn outline small" id="reset-filters" type="button">
       Réinitialiser
      </button>
     </div>
     <div class="filter-grid">
      <div class="field">
       <label for="search">
        Recherche
       </label>
       <input id="search" placeholder="Marque ou modèle"/>
      </div>
      <div class="field">
       <label for="category">
        Catégorie
       </label>
       <select id="category">
        <option value="">
         Toutes les catégories
        </option>
       </select>
      </div>
      <div class="field">
       <label for="price-min">
        Prix minimum ($)
       </label>
       <input id="price-min" min="0" placeholder="Min" type="number"/>
      </div>
      <div class="field">
       <label for="price-max">
        Prix maximum ($)
       </label>
       <input id="price-max" min="0" placeholder="Max" type="number"/>
      </div>
      <div class="field">
       <label for="seats-filter">Nombre de places</label>
       <select id="seats-filter">
        <option value="">Toutes les places</option>
        <option value="2">2 places</option>
        <option value="4">4 places</option>
        <option value="6">6 places</option>
       </select>
      </div>
      <div class="field">
       <label for="trunk-min">
        Poids coffre min (kg)
       </label>
       <input id="trunk-min" min="0" placeholder="Min" step="1" type="number"/>
      </div>
      <div class="field">
       <label for="trunk-max">
        Poids coffre max (kg)
       </label>
       <input id="trunk-max" min="0" placeholder="Max" step="1" type="number"/>
      </div>
     </div>
    </div>
    <p class="muted" id="results">
    </p>
    <div class="grid" id="vehicle-grid">
    </div>
   </div>
  </main>
  <div id="footer">
  </div>
 <div id="vehicle-modal" class="vehicle-modal" role="dialog" aria-modal="true" aria-labelledby="vehicle-modal-title" hidden><div class="vehicle-modal-dialog"><button type="button" id="vehicle-modal-close" class="vehicle-modal-close" aria-label="Fermer la fiche">×</button><div id="vehicle-modal-content"></div></div></div>
 </body>
</html>
